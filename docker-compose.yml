version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phantom_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the current directory to /app for hot-reloading (optional)
      # Note: uvicorn needs --reload flag for this to work, but we kept CMD simple
      - .:/app
    env_file:
      - .env
    environment:
      - DOCKER_MODE=true
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: phantom_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom}
      POSTGRES_DB: ${POSTGRES_DB:-phantom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phantom_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
